<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Overview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; font-family: "Segoe UI", system-ui, sans-serif; }
  .wrap { display: flex; flex-direction: column; height: 100%; }
  .tape { flex: 0 0 auto; border-bottom: 1px solid #e1e1e1; }
  .main { flex: 1 1 auto; min-height: 0; }
  .tradingview-widget-container, .tradingview-widget-container__widget { height: 100%; width: 100%; }
  .tape .tradingview-widget-container { height: 78px; }
  .note { font-size: 11px; color: #777; padding: 4px 8px; text-align: right; }
  .note a { color: #777; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Ticker tape: major indices, futures, VIX, crypto -->
  <div class="tape">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "FOREXCOM:SPXUSD", "title": "S&P 500"},
          {"proName": "FOREXCOM:NSXUSD", "title": "Nasdaq 100"},
          {"proName": "FOREXCOM:DJI", "title": "Dow Jones"},
          {"proName": "TVC:RUT", "title": "Russell 2000"},
          {"proName": "CBOE:VIX", "title": "VIX"},
          {"proName": "NYMEX:CL1!", "title": "Crude Oil"},
          {"proName": "TVC:GOLD", "title": "Gold"},
          {"proName": "TVC:US10Y", "title": "US 10Y"},
          {"proName": "BITSTAMP:BTCUSD", "title": "Bitcoin"}
        ],
        "showSymbolLogo": true,
        "colorTheme": "light",
        "isTransparent": true,
        "displayMode": "adaptive",
        "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- Tabbed market overview -->
  <div class="main">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
      {
        "colorTheme": "light",
        "dateRange": "1D",
        "showChart": true,
        "locale": "en",
        "width": "100%",
        "height": "100%",
        "largeChartUrl": "",
        "isTransparent": true,
        "showSymbolLogo": true,
        "showFloatingTooltip": true,
        "tabs": [
          {
            "title": "Indices",
            "symbols": [
              {"s": "FOREXCOM:SPXUSD", "d": "S&P 500"},
              {"s": "FOREXCOM:NSXUSD", "d": "Nasdaq 100"},
              {"s": "FOREXCOM:DJI", "d": "Dow 30"},
              {"s": "TVC:RUT", "d": "Russell 2000"},
              {"s": "CBOE:VIX", "d": "VIX"}
            ]
          },
          {
            "title": "Mega Caps",
            "symbols": [
              {"s": "NASDAQ:AAPL"}, {"s": "NASDAQ:MSFT"}, {"s": "NASDAQ:NVDA"},
              {"s": "NASDAQ:AMZN"}, {"s": "NASDAQ:GOOGL"}, {"s": "NASDAQ:META"}
            ]
          },
          {
            "title": "Commodities",
            "symbols": [
              {"s": "NYMEX:CL1!", "d": "Crude Oil"},
              {"s": "TVC:GOLD", "d": "Gold"},
              {"s": "TVC:SILVER", "d": "Silver"},
              {"s": "NYMEX:NG1!", "d": "Natural Gas"}
            ]
          },
          {
            "title": "Rates & FX",
            "symbols": [
              {"s": "TVC:US02Y", "d": "US 2Y"},
              {"s": "TVC:US10Y", "d": "US 10Y"},
              {"s": "TVC:DXY", "d": "US Dollar Index"},
              {"s": "FX:EURUSD", "d": "EUR/USD"}
            ]
          }
        ]
      }
      </script>
    </div>
  </div>

  <div class="note">Data by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a>. Some data may be delayed.</div>
</div>
</body>
</html>
